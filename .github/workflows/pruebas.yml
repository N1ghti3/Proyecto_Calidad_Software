# Ejecuta toda la suite de pruebas contra un PostgreSQL 16 real.
#
# Criterio de OE-3 (PDF, Tabla 6): «el flujo de trabajo falla si una prueba
# falla». ADR-009: en cada cambio se aplican todas las migraciones desde cero.
# Ambas cosas las cubre pytest: tests/integration/test_migraciones.py sube,
# baja y vuelve a subir el esquema en una base vacía.

name: Pruebas

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # Misma imagen y misma colación que desarrollo (ADR-009, ADR-011).
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: tiendalocal_owner
          POSTGRES_PASSWORD: pruebas_owner
          TZ: UTC
          PGTZ: UTC
          POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=es-CO --locale=C --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tiendalocal_owner -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Credenciales de una base efímera que solo existe durante este trabajo.
      TEST_DATABASE_ADMIN_URL: postgresql+psycopg://tiendalocal_owner:pruebas_owner@127.0.0.1:5432/postgres
      TEST_APP_DB_PASSWORD: pruebas_app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r backend/requirements-dev.txt

      - name: Ejecutar pruebas
        run: pytest --junitxml=reporte-pruebas.xml

      - name: Publicar reporte como evidencia
        # Evidencia de los indicadores del PDF (I-02: consistencia del
        # inventario). Se publica también si las pruebas fallan.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: reporte-pruebas.xml
          retention-days: 90
