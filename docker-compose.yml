# TiendaLocal — Docker Compose
#
# ESTADO: los tres servicios están implementados y conectados.
#
# Flujo real:  navegador -> frontend (nginx) -> backend (FastAPI) -> PostgreSQL
#
# El navegador habla con un solo origen: pide la aplicación al frontend y le
# pide también `/api/v1/...`, que nginx reenvía al backend por la red interna.
# De ahí que el backend no publique puerto hacia la máquina salvo que se quiera
# para depurar: no necesita ser alcanzable desde fuera.
#
# Puesta en marcha, desde la raíz del repositorio:
#
#   cp .env.example .env          # y rellenar las contraseñas y JWT_SECRET
#   docker compose up -d --build
#   docker compose exec backend alembic upgrade head
#   docker compose exec backend python database/seeds/sembrar_desarrollo.py
#
# Después: la tienda en http://localhost:8080 y la documentación de la API en
# http://localhost:8080/api/v1/docs
#
# Las variables se toman del archivo .env de esta misma carpeta, creado a partir
# de .env.example. El archivo .env nunca se versiona (riesgo R-07).
#
# Versión del motor fijada por ADR-009: una base que aquí es 16 y en el servidor
# es otra es una fuente de fallos que nadie va a buscar ahí.

services:
  postgres:
    image: postgres:16-alpine
    container_name: tiendalocal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Toda fecha se almacena en UTC (convención del contrato de integración).
      TZ: UTC
      PGTZ: UTC
      # Colación del clúster (ADR-011). Esta imagen usa musl, que no implementa
      # las colaciones de libc: declara el locale que se le pida y ordena por
      # bytes igual, de modo que «Ábaco» caería al final del catálogo. Con
      # proveedor ICU el orden alfabético es correcto sin anotar ninguna
      # consulta ni ninguna columna.
      #
      # ATENCIÓN: initdb solo corre en la PRIMERA inicialización del volumen.
      # Cambiar esta línea sobre un volumen existente no tiene efecto y no
      # avisa. Para comprobar qué usa realmente el clúster:
      #   select datlocprovider, daticulocale from pg_database
      #     where datname = current_database();   -- debe dar 'i' y 'es-CO'
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=es-CO --locale=C --encoding=UTF8"
    ports:
      # Solo se publica en la interfaz local: la base nunca queda expuesta a la red.
      - "127.0.0.1:5432:5432"
    volumes:
      # Volumen con nombre: los datos sobreviven a apagar o recrear el contenedor.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Permite que otros servicios esperen a que la base acepte conexiones,
      # en lugar de arrancar contra un motor que todavía está inicializando.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      # Contexto en la raíz: la imagen incluye también database/seeds.
      context: .
      dockerfile: backend/Dockerfile
    container_name: tiendalocal-backend
    restart: unless-stopped
    environment:
      # Dentro de la red de Docker el host es el nombre del servicio, no
      # 127.0.0.1: esa dirección sería el propio contenedor del backend, donde
      # no hay ninguna base escuchando. Las credenciales salen del .env.
      DATABASE_URL: postgresql+psycopg://tiendalocal_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_MIGRATION_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD}
      # En el despliegue el navegador no habla con el backend directamente
      # —pasa por nginx, mismo origen—, de modo que esta lista solo sirve para
      # quien levante Vite contra este backend.
      CORS_ORIGENES: ${FRONTEND_URL:-http://localhost:5173}
      # Imágenes cargadas desde el panel (EP-16). En un volumen para que no se
      # pierdan al reconstruir o recrear el contenedor.
      MEDIA_DIR: /srv/media
      TZ: UTC
    volumes:
      - media_cargas:/srv/media
    depends_on:
      postgres:
        # No «arrancado», sino «aceptando conexiones»: PostgreSQL tarda unos
        # segundos en inicializar, y un backend que arranca antes falla al
        # primer intento sin razón aparente.
        condition: service_healthy
    ports:
      # Solo en la interfaz local y solo para depurar o para apuntar Vite aquí.
      # Puede quitarse sin afectar a la tienda, que entra por el frontend.
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tiendalocal-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 8080 y no 80: en muchas máquinas el 80 ya está ocupado, y pedir
      # privilegios de administrador para levantar la tienda sería innecesario.
      - "8080:80"

volumes:
  postgres_data:
    name: tiendalocal_postgres_data
  media_cargas:
    name: tiendalocal_media_cargas
