[pytest]
testpaths = tests
# backend: modelos y configuración; database/seeds: guion de siembra;
# tests: módulo de apoyo compartido.
pythonpath = backend database/seeds tests
addopts = -ra --strict-markers
markers =
    integracion: requiere PostgreSQL (variable TEST_DATABASE_ADMIN_URL)
    concurrencia: escenarios de CP-90 contra PostgreSQL real
