# TiendaLocal — configuración de Alembic (ADR-009)
#
# La URL de conexión NO se escribe aquí: la lee env.py de la variable de
# entorno DATABASE_MIGRATION_URL, que apunta al rol propietario
# (tiendalocal_owner). Poner credenciales en este archivo las versionaría,
# que es exactamente lo que el riesgo R-07 pide evitar.

[alembic]
script_location = alembic

# Nombre de archivo de cada revisión: fecha ordenable + descripción.
# Así el directorio versions/ se lee en orden cronológico.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

prepend_sys_path = .

# Las fechas de las revisiones se generan en UTC, como todo lo demás.
timezone = UTC

[post_write_hooks]
# Sin ganchos: el formato se revisa en la revisión cruzada de Pull Request.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
