# nginx del contenedor del frontend: sirve la aplicación y hace de proxy
# inverso hacia la API (componente C2 de la Tabla 9).
#
# Que el proxy viva aquí y no en un contenedor aparte tiene una consecuencia
# que vale la pena entender: el navegador habla con un solo origen. El
# frontend pide `/api/v1/...` a la misma dirección de la que se descargó, y
# nginx lo reenvía al backend por la red interna de Docker. Así no hay CORS en
# el despliegue —la configuración de CORS del backend es solo para desarrollo,
# donde Vite corre en otro puerto— y la API nunca queda expuesta directamente.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión (RNF-01). Las imágenes ya vienen comprimidas en su formato;
    # volver a comprimirlas gasta tiempo de CPU sin ahorrar bytes.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # Cabeceras de seguridad. No sustituyen a la validación del servidor, pero
    # cierran rutas de ataque que el código de la aplicación no puede cerrar.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ----------------------------------------------------------------- API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Se sobrescribe, no se agrega ($proxy_add_x_forwarded_for): nginx es la
        # puerta de entrada, y un encabezado que trajera el cliente le dejaría
        # fingir otra IP ante el límite de intentos de inicio de sesión. Si algún
        # día se pone un balanceador delante, esto debe tomar su IP real.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Mismo identificador de petición en los registros de nginx y en los de
        # la aplicación: seguir el rastro de un fallo no exige correlacionar
        # por marca de tiempo.
        proxy_set_header X-Request-Id      $request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # nginx corta los cuerpos de más de 1 MB por omisión, con una página
        # HTML de 413 que el frontend no sabe leer. La API acepta imágenes de
        # hasta 5 MiB (EP-16) y responde su propio PAYLOAD_TOO_LARGE; el
        # margen deja que sea ella quien decida.
        client_max_body_size 6m;
    }

    # Imágenes cargadas desde el panel (EP-16): las escribe y las sirve la
    # API, porque nacen en ejecución y no están en la imagen de este
    # contenedor. Gana sobre `location /media/` por ser el prefijo más largo.
    location /media/cargas/ {
        proxy_pass http://backend:8000;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ------------------------------------------------------------- activos
    # Los archivos que Vite emite llevan una huella en el nombre, de modo que
    # un cambio produce un nombre nuevo. Por eso pueden cachearse por mucho
    # tiempo sin riesgo de servir una versión vieja.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --------------------------------------------------- fotografías
    # Las rutas que el catálogo guarda en la base (/media/productos/…) se
    # sirven desde aquí. El `=404` es lo importante: sin este bloque la
    # petición caería en `try_files … /index.html` de más abajo y el navegador
    # recibiría una página HTML donde espera una imagen. El resultado es un
    # ícono de imagen rota que no distingue «no hay foto» de «el servidor
    # respondió mal», y que esconde el 404 de los registros.
    #
    # Los archivos se colocan en frontend/public/media/productos/, que Vite
    # copia tal cual al construir. Mientras no existan, la interfaz muestra un
    # bloque de color en lugar de romperse.
    location /media/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ------------------------------------------------------------- la app
    # index.html NO se cachea: es el único archivo que conserva su nombre entre
    # versiones, y es el que apunta a los demás. Cacheado, el navegador seguiría
    # pidiendo los activos de la versión anterior después de un despliegue.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
